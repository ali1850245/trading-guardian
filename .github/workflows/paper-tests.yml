name: Paper Trading Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate paper trading report
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from backtest import run_backtest
          df = pd.DataFrame({'open':[100,100,101,102,103,104],'high':[101,101.5,102.5,104,105,106],'low':[99,99.5,100.5,101.5,102.5,103],'close':[100,101,102,103,104,105]})
          def signal(_): return {'decision':'LONG','entry':100,'stop':98,'tp1':102}
          result = run_backtest(df, 'PAPER-SAMPLE', signal, starting_balance=10000.0, fee_rate=0.0, slippage_rate=0.0)
          with open('paper-trading-report.json','w',encoding='utf-8') as f: json.dump(result,f,indent=2)
          print(json.dumps(result,indent=2))
          PY
      - name: Publish report summary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('paper-trading-report.json',encoding='utf-8'))
          lines=['# Paper Trading Report','',f"- Symbol: {r['symbol']}",f"- Candles: {r['candles']}",f"- Trades: {r['trades']}",f"- Wins: {r['wins']}",f"- Losses: {r['losses']}",f"- Win rate: {r['win_rate']}%",f"- PnL: {r['pnl']}",f"- Max drawdown: {r['max_drawdown']}",f"- Profit factor: {r['profit_factor']}",f"- TP1 hits: {r['tp1_hits']}",f"- SL hits: {r['sl_hits']}",f"- End exits: {r['end_exits']}"]
          open('paper-trading-summary.md','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY
          cat paper-trading-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload paper trading report
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-report
          path: |
            paper-trading-report.json
            paper-trading-summary.md
