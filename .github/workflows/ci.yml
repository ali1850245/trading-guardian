name: Trading Guardian CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile project Python files
        run: python -m py_compile bot.py engine.py review.py backtest.py execution.py tests/test_engine.py tests/test_execution.py tests/test_backtest.py tests/smoke_menu.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run menu smoke test
        run: python tests/smoke_menu.py
      - name: Verify safe paper-only boundary
        run: python -c "from execution import LiveExecutionAdapter, ExecutionMode; assert LiveExecutionAdapter.mode is ExecutionMode.LIVE_DISABLED; print('Live execution boundary: DISABLED')"
