name: Raw Telegram Bot

on:
  workflow_dispatch:
  push:
    paths:
      - 'telegram_raw.py'
      - '.github/workflows/telegram-raw.yml'
      - 'requirements.txt'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check bot
        run: python -m py_compile telegram_raw.py

      - name: Start raw Telegram bot
        run: python telegram_raw.py
