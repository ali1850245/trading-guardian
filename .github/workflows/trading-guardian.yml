name: Trading Guardian CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYMBOL: BTCUSDT
      OPENAI_MODEL: gpt-5.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repair malformed alignment loop if present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('engine.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^(?P<indent>[ \t]*)alignment_parts=\[\]\n(?P<bad>[ \t]+)if name in valid: alignment_parts\.append\(_direction\(valid\[name\]\["score"\],2\)\)')
          replacement = '''\\g<indent>alignment_parts=[]
          \\g<indent>for name in ("1d","4h","1h","30m","15m","10m","5m"):
          \\g<indent>    if name in valid: alignment_parts.append(_direction(valid[name]["score"],2))'''
          fixed, count = pattern.subn(replacement, text, count=1)
          if count:
              path.write_text(fixed, encoding='utf-8')
              print('Repaired engine alignment loop')
          else:
              print('No malformed alignment loop found')
          PY

      - name: Validate Python files
        run: python -m py_compile engine.py bot.py tests/test_engine.py

      - name: Run engine tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
