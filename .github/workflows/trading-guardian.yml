name: Trading Guardian

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
  SYMBOL: ${{ secrets.SYMBOL }}
  OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python files
        run: python -m py_compile engine.py bot.py

      - name: Validate and normalize Telegram token
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("TOKEN", "").strip()
          if not token:
              raise SystemExit("ERROR: TELEGRAM_BOT_TOKEN GitHub secret is missing.")

          # Accept common accidental formatting when a token was pasted with
          # quotes, a variable name, or line breaks.
          if token.startswith("TELEGRAM_BOT_TOKEN="):
              token = token.split("=", 1)[1].strip()
          if len(token) >= 2 and token[0] == token[-1] and token[0] in "'\"":
              token = token[1:-1].strip()
          token = "".join(token.split())

          parts = token.split(":", 1)
          if len(parts) != 2 or not parts[0].isdigit() or len(parts[1]) < 20:
              raise SystemExit("ERROR: TELEGRAM_BOT_TOKEN format is invalid.")

          Path("/tmp/telegram_token").write_text(token, encoding="utf-8")
          print("TELEGRAM_BOT_TOKEN format accepted after normalization.")
          PY

      - name: Prepare Telegram token
        run: |
          echo "TELEGRAM_BOT_TOKEN=$(cat /tmp/telegram_token)" >> "$GITHUB_ENV"

      - name: Validate OpenAI configuration
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "WARNING: OPENAI_API_KEY is missing; AI review will be unavailable."
          else
            echo "OPENAI_API_KEY is configured."
          fi

      - name: Start Telegram bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          SYMBOL: ${{ secrets.SYMBOL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python bot.py
